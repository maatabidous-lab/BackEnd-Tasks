<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Public/emp.css">
    <title>Employees</title>
</head>

<body>

    <div class="container">
        <div class="head">
            <div>
                <h1>👨‍⚕️ Employees</h1>
                <p>Manage pharmacy team</p>
            </div>
            <!-- ده مش button، ده label بيفتح المودال -->
            <label for="modal-toggle" id="AddBtn" class="btn add-btn">+ Add Employee</label>
        </div>
        <div class="stats">
            <div class="stat">
                <b id="TotalEmployee">0</b>
                <span>Total Employees</span>
            </div>

            <div class="stat">
                <b id="Totalpharmaciest">0</b>
                <span>Pharmacists</span>
            </div>

            <div class="stat">
                <b id="TotalChacier">0</b>
                <span>Cashiers</span>
            </div>

            <div class="stat">
                <b id="TotalDelivery">0</b>
                <span>Delivery</span>
            </div>

            <div class="stat">
                <b id="TotalCleaner">0</b>
                <span>Cleaner</span>
            </div>

            <div class="stat">
                <b id="TotalManager">0</b>
                <span>Manager</span>
            </div>

            <div class="stat">
                <b id="TotalSalaries">0</b>
                <b>EGP</b>
                <span>Total Salaries</span>
            </div>
        </div>
        <div class="toolbar">
            <input type="text" id="SearchBar" placeholder="Search by employee name...">
        </div>
        <div class="grid" id="GridBody">

        </div>
    </div>
    <input type="checkbox" id="modal-toggle" class="modal-toggle">
    <!-- ============================================================= -->
    <div class="modal">
        <label for="modal-toggle" class="modal-bg"></label>

        <div class="modal-box">
            <div class="modal-head">
                <h2>➕ Add New Employee</h2>
                <label for="modal-toggle" class="close">✕</label>
            </div>

            <form>
                <div class="field">
                    <label>Full Name *</label>
                    <input type="text" placeholder="e.g. Ahmed Mohamed" id="NameInp" required>
                </div>

                <div class="row">
                    <div class="field">
                        <label>Phone *</label>
                        <input type="tel" placeholder="01xxxxxxxxx" id="PhoneInp" required>
                    </div>
                    <div class="field">
                        <label>Role *</label>
                        <select required id="RoleInp">
                            <option value="">Choose Role</option>
                            <option>Pharmacist</option>
                            <option>Cashier</option>
                            <option>Delivery</option>
                            <option>Manager</option>
                            <option>Cleaner</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Shift</label>
                        <select id="ShiftInp">
                            <option>Morning ☀️</option>
                            <option>Evening 🌙</option>
                            <option>Night 🌃</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Salary (EGP) *</label>
                        <input type="number" id="salaryInp" placeholder="5000" min="0" required>
                    </div>
                </div>
                <div class="field">
                    <label>Address</label>
                    <input type="text" id="AddressInp" placeholder="Shebin El-Kom...">
                </div>
                <button type="button" id="SaveEmp" class="btn add-btn">Save Employee</button>

            </form>
        </div>
    </div>

    <script src="../Public/emp.js"></script>
</body>

</html>
